services:
  backend:
    build: ./backend
    container_name: smart-split-backend
    ports:
      - "8145:8145"
    depends_on:
      - postgres
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8145
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=smart_split
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8145/api/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:17.6-alpine3.22
    container_name: smart-split-postgres
    environment:
      POSTGRES_DB: smart_split
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: 
      context: ./frontend/smart-split-vite
      args:
        - VITE_API_BASE_URL=http://localhost:8056
    container_name: smart-split-frontend
    ports:
      - "3060:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8056
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 5s
  nginx:
    build: ./nginx
    container_name: smart-split-nginx
    ports:
      - "8056:80"
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
